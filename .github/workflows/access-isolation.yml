name: Access isolation (PostGIS)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  universal-scope:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prisma_scope_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d prisma_scope_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prisma_scope_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx jest --config tests/integration/jest.config.cjs --runInBand
